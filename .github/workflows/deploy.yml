name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'stage/**'
      - 'config/site.ts'
      - 'scripts/minify.ts'
      - 'scripts/validate.ts'
      - 'scripts/common.ts'
      - 'scripts/confirm.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Minify committed stage
        run: npm run minify
        env:
          ALLOW_OVERWRITE: '1'

      - name: Validate generated site
        run: npm run validate

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload generated dist
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
